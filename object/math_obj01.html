<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math 객체</title>
</head>
<body>
    <script>
    let num = 2.623;
    // max() : 주어진 숫자 중 가장 큰 값
    let maxNum = Math.max(10,5,8,30)
    console.log(maxNum);
    // min() : 주어진 숫자중 가장 작은값
    let MinNum = Math.min(10,5,8,30)
    console.log(minNum);
    //round() 소수점 첫번째 자리에서 반올림 
    let roundNum = Math.round(num)
    console.log(roundNum);  // 2.623을 반올림 한 값 
    // floor() 소수점을 버리고 내림 (정수로 변환)
    let floorNum = Math.floor(num)
    console.log(floorNum); // 2 
    // ceil() 소숫점을 올림하여 정수로 변환 
    let ceilNum = Math.ceil(num)
    console.log(ceilNum);
    // random() 0초과 1사이의 난수 (ex)0.813)
    let randomNum = Math.random()

    //  PI 원주율 값을 반환
      let piNum = Math.PI;
      console.log(piNum);

    </script>
</body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>date 객체</title>
  </head>
  <style>
    #product-list{
        display: flex;
    }
    


  </style>
  <body>
    <h1>상품 리스트</h1>
    <div id="product-list">
      <!-- js출력 -->
      <div class="product">
        <h3>상품명:</h3>
        <p>등록일:</p>
      </div>
    </div>
    <script>
      // 상품 더미 데이터
      const products = [
        { name: "노트북", date: new Date(2026, 4, 25) },

        { name: "스마트폰", date: new Date() },
      ];

      const productlist = document.querySelector("#product-list");
      
      products.forEach((prod) => {
        // product의 것.
        console.log(prod);
        productlist.innerHTML += `<div class="product">
            <h3>상품명: ${prod.name}</h3>
            <p>등록일: ${prod.date.toLocaleDateString}</p>
           </div>
            `;
      });
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체</title>
</head>
<body>
    <script>
        //자바스크립트 표준 내장 객체 종류
        // 1. string 2. array 3. date 4. math(수학)
        // 1. string 
        const Str = "Hello World"
        console.log(Str); //Hello world
        console.log(Str. length) // 문자의 길이를 알 수있는 속성 11 
        console.log(Str.toUpperCase())
        // 객체 안에 프로퍼티 메소드가 있다. 
        //프로퍼티 - 기능&속성 // 메소드 - 행동 , ()유무로 판단가능
        console.log(Str.includes("World")); // true,faluse 로 include는 해당하는 내용이 있는지 없는지
        // 2. Array 내장객체 (배열)
        const arr = [1,2,3,4]
        console.log(arr);
        // 알고싶다면 배열안에 . 으로 접근한다
        console.log(arr.length);
        console.log(arr.push(5));
        console.log(arr); // [1,2,3,4,5] 
        console.log(arr.join("==")); // 1==2==3==4==5
        //  3. Date객체 
        const today = new Date()
        console.log(today); // 내장객체 Date 안에는 한국표준시가 담겨져있다. 
        console.log(today.toDateString()) // todate -오늘날짜만 출력해라
        console.log(today.getFullYear()); // 연도
        console.log(today.getMonth() + 1); // 월(0부터 출력하기 때문에 + 1을 해야한다)
        // 4.math 객체 
        console.log(Math.PI); //3.141592 math라는 수학공식중에 . 으로 pi 로 접근할 수있다.
        console.log(Math.max(10,23,100)); // 셋중에 가장 큰거
        console.log(Math.min(10,23,100));
        console.log(Math.random()); //0~1사이 난수만 출력한다 
        

    </script>
</body>
</html>

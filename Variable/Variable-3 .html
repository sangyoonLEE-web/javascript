    <script>
      // 1. 선언 - 금액
      // 2. total - 다 더한거
      // 3. 화면출력

      let banana = 3000;
      let apple = 5000;
      let mango = 8000;
     

      let bananaCount = 3;
      let appleCount = 3;
      let mangoCount = 3;

       let total = (banana * bananaCount) + (apple * appleCount) + (mango * mangoCount);
      
      console.log(total);

      document.write(`<p> 바나나 사과 망고를 다 더한 금액은 <span> ${total} </span> 입니다. </p>`);
    </script>

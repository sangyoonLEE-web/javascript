<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자바 3</title>
  </head>
  <body>
    <script>
      
      let now = new Date()
      console.log(now);
      let display = now.toDateString();
      let dispalyTime = now.toLocaleDateString();
      console.log(display);
      console.log(dispalyTime);
      document.write(`오늘 날짜는 ${display}이고 , 현재 시각은 ${dispalyTime}`)
      
      
    </script>
  </body>
</html>

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      //변수 연산
      let x = 100;
      let y = 30;
      let total = x + y;

      //x와 y를 곱한 식을 변수에 담기

      console.log(x, y);
      console.log(total);

      let result = x * y;

      console.log(x, y);
      console.log(result);



      document.write(`<p> x와 y을 더한 금액은 <span> ${total} </span> </p>`);
      // x와 y를 곱한 금액은
      document.write(`<p> x와 y을 곱한 금액은 <span> ${result} </span> </p>`);
   
       
   
   
   
   </script>
  </body>

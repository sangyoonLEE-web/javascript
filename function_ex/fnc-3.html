<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>함수 예제1</title>
</head>
<body>
    <button onclick="changeColor('skyblue')"> 하늘색</button>
    <button onclick="changeColor('pink')">핑크색</button>
    <button onclick="changeColor('yellow')">노랑색</button>
    <script>
        function changeColor(bg){
            //console.log(bg);
            document.body.style.backgroundColor = bg; // 바디의 스타일을 백그라운드를 bg로 준다. 
        }

    </script>
</body>
</html>
